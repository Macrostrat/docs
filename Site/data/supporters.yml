# Supporters of Macrostrat, rendered on /about/support.
# tier: funder | institutional | in-kind
# projects: which projects the support is for (macrostrat, rockd)
# Grants (tier: funder) also carry title, program, award and pi (the lead PI);
#   other support carries contribution, a short name for what is given, shown
#   where a grant shows its program. Grants lead with their title; other cards
#   have none. The organization (name) follows the program or contribution.
#   Ordered by tier, then newest first by period.
# NSF titles, programs, PIs and periods are from the NSF award records.
