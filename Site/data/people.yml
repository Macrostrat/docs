# Contributors to Macrostrat, rendered on /community.
#
# lab: Macrostrat lab membership: current | former | a position, or a list of them.
#      A position is { title, start: YYYY, end: YYYY }, all optional; a missing end
#      means current. Omitted for outside contributors.
# status: current | former, only where lab membership doesn't say: a former member
#         still contributing, or an outside contributor.
# roles: from the vocabulary at the bottom of this file. `researcher` is for
#        people the lab has paid in a scientific role.
# photo_url: existing bucket URL; the target convention is
#            https://storage.macrostrat.org/assets/web/people/<id>.jpg
# email: published only when the person has agreed; omitted otherwise
# contributions: what the person has contributed, one short item each
#
# Seeded from the v1 People page and the Rockd acknowledgments. Titles and periods
# need confirmation by the people themselves.
